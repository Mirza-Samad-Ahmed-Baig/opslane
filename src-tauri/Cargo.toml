[package]
name = "Opslane"
version = "0.1.0"
description = "Opslane - Manage multiple Claude Code sessions in parallel"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Enable integration tests that require external services (e.g., Docker daemon)
integration-tests = []

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.8.5", features = [] }
tauri-plugin-log = "2"

# Tauri plugins for native features
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"

# Database dependencies
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["full"] }

# Docker dependencies
bollard = "0.18"
futures-util = "0.3"

# Basic utilities
thiserror = "1.0"
anyhow = "1.0"
dirs = "5.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
env_logger = "0.11"
base64 = "0.22"

# File watcher dependencies
notify = "6.1"
notify-debouncer-mini = "0.4"
chrono = { version = "0.4", features = ["serde"] }
shell-escape = "0.1"

# .gitignore parsing and directory walking
ignore = "0.4"           # Gitignore-aware directory walking (from ripgrep)

# Temporary file handling
tempfile = "3.8"  # For secure atomic temp file creation

[dev-dependencies]
